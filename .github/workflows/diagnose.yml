name: Diagnose /quiz paa webhotellet

# Koeres manuelt (Actions -> Diagnose -> Run workflow). Kalder /quiz, saa IIS
# forsoeger at starte appen, og henter derefter filliste og stdout-log via FTP.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      FTP: ftp://${{ secrets.FTP_HOST }}/public_html/quiz
      FTP_AUTH: ${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}
      UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36
    steps:
      - name: Kald siden
        run: |
          for p in /quiz/ /quiz/Quiz; do
            curl -s -A "$UA" -o /dev/null -w "$p %{http_code}\n" "https://villadsclaes.dk$p" || true
          done
          sleep 15

      - name: Filer i /public_html/quiz
        run: curl -s --user "$FTP_AUTH" "$FTP/" --list-only | grep -v '\.dll$' | sort

      - name: stdout-log
        run: |
          logs=$(curl -s --user "$FTP_AUTH" "$FTP/logs/" --list-only | sort || true)
          if [ -z "$logs" ]; then
            echo "Ingen logs-mappe/logfiler: IIS har ikke startet QuizApp.exe."
            exit 0
          fi
          echo "$logs"
          newest=$(echo "$logs" | tail -1)
          echo "----- $newest -----"
          curl -s --user "$FTP_AUTH" "$FTP/logs/$newest" | tail -60
